<!doctype html>
<html>

<head>
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,
        100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,
        500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>

<body>
    <section>

        <div class="Head">
            <div class="headcontent">
                <img id="parrot" src="assets/parrot.png" alt="The flying parrot">
                <div class="headtext">
                    <h1>PollyGlot</h1>
                    <p>Perfect Translation Every Time</p>
                </div>
            </div>
        </div>

        <div class="content">
            <div class="input-section">
                <h2>Text to translate 👇</h2>
                <textarea id="inputText" placeholder="Type or paste text here..."></textarea>
                <h2>Select Language 👇</h2>
                <input type="radio" id="french" name="fav_language" value="french">
                <label for="french">French</label>
                <img src="assets/fr-flag.png" alt="French Flag" class="flag"><br>
                <input type="radio" id="spanish" name="fav_language" value="spanish">
                <label for="spanish">Spanish</label>
                <img src="assets/sp-flag.png" alt="Spanish Flag" class="flag"><br>
                <input type="radio" id="japanese" name="fav_language" value="japanese">
                <label for="japanese">Japanese</label>
                <img src="assets/jpn-flag.png" alt="Japanese Flag" class="flag"><br>
                <button id="translateButton">Translate</button>
            </div>
            <div class="output-section">
                <h2>Translated Text 👇</h2>
                <textarea id="outputText" placeholder="Your translated text will appear here..." readonly></textarea>

        </div>
        <script src="index.js" type="module"></script>
    </section>
</body>

</html>
