<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PollyGlot — AI Translation</title>
    <meta name="description" content="PollyGlot: Simple, AI-powered translation. Translate text to French, Spanish, or Japanese instantly.">
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar" id="navbar">
        <div class="navbar-inner">
            <div class="navbar-brand">
                <img src="assets/parrot.png" alt="PollyGlot Parrot" class="navbar-logo">
                <span class="navbar-title">PollyGlot</span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-container">
        <div class="hero-card" id="heroCard">
            <h1 class="hero-heading">What would you like to translate?</h1>
            <p class="hero-sub">Choose a language and type your text below</p>

            <!-- Language Selector -->
            <div class="lang-selector" id="langSelector">
                <button class="lang-pill" data-lang="french" id="lang-french">
                    <span class="lang-flag">🇫🇷</span>
                    <span class="lang-name">French</span>
                </button>
                <button class="lang-pill" data-lang="spanish" id="lang-spanish">
                    <span class="lang-flag">🇪🇸</span>
                    <span class="lang-name">Spanish</span>
                </button>
                <button class="lang-pill" data-lang="japanese" id="lang-japanese">
                    <span class="lang-flag">🇯🇵</span>
                    <span class="lang-name">Japanese</span>
                </button>
            </div>

            <!-- Input -->
            <div class="input-group">
                <label for="inputText" class="input-label">Your text</label>
                <textarea id="inputText" class="text-area" placeholder="Type or paste text here..." rows="5"></textarea>
            </div>

            <!-- Translate Button -->
            <button id="translateButton" class="translate-btn">
                <span class="btn-text">Translate</span>
            </button>

            <!-- Output -->
            <div class="output-card" id="outputCard">
                <div class="output-header">
                    <span class="output-label">Translation</span>
                    <span class="output-lang" id="outputLang"></span>
                </div>
                <div class="output-text" id="outputText"></div>
            </div>
        </div>
    </main>

    <script src="index.js" type="module"></script>
</body>

</html>
